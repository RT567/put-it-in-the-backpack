<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Put It In The Backpack</title>
<meta name="description" content="Click things. Put them in the backpack.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene">
  <header class="title">
    <h1>Put It In The Backpack</h1>
    <p>click a thing to put it in the backpack</p>
  </header>

  <!-- The backpack. It never changes. That's the whole point. -->
  <div class="backpack" aria-hidden="true">
    <svg viewBox="0 0 300 370">
      <path d="M118 66 C112 30 150 14 172 30 C186 40 186 56 180 68" fill="none" stroke="#000" stroke-width="5"/>
      <path d="M64 118 C52 84 92 58 140 62 C178 56 236 70 238 116 C244 170 236 220 250 290 C254 330 236 342 210 338 C160 348 120 334 84 344 C52 346 48 322 54 290 C62 230 44 170 64 118 Z" fill="#f00" stroke="#000" stroke-width="4"/>
      <path d="M66 130 C104 168 186 176 236 124" fill="none" stroke="#000" stroke-width="3"/>
      <path d="M98 222 C130 214 170 226 204 218 C210 250 200 280 206 302 C170 310 130 296 96 306 C100 280 90 250 98 222 Z" fill="#f00" stroke="#000" stroke-width="3"/>
    </svg>
  </div>

  <button class="item ball" type="button" data-item aria-label="Basketball">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="#ff8000" stroke="#000" stroke-width="2"/>
      <path d="M58 9 C64 40 54 80 62 111 M9 58 C40 66 80 52 111 62" fill="none" stroke="#000" stroke-width="4"/>
    </svg>
  </button>

  <button class="item shoes" type="button" data-item aria-label="A pair of shoes">
    <svg viewBox="0 0 200 130" aria-hidden="true">
      <path d="M40 80 C36 60 44 36 50 30 C66 40 80 48 110 50 C150 52 176 62 172 84 C130 90 80 84 40 80 Z" fill="#00f" stroke="#000" stroke-width="3"/>
      <path d="M12 110 C8 90 16 64 24 58 C40 70 56 76 84 78 C124 80 150 90 146 112 C100 118 56 114 12 110 Z" fill="#00f" stroke="#000" stroke-width="4"/>
    </svg>
  </button>

  <button class="item cup" type="button" data-item aria-label="A cup">
    <svg viewBox="0 0 130 130" aria-hidden="true">
      <path d="M98 50 C128 44 126 100 92 92" fill="none" stroke="#000" stroke-width="5"/>
      <path d="M18 22 C50 28 76 18 104 26 C98 60 102 90 94 118 C70 124 50 116 30 122 C26 90 28 56 18 22 Z" fill="#fff" stroke="#000" stroke-width="3"/>
    </svg>
  </button>

  <button class="item clothes" type="button" id="clothes" aria-label="A pile of clothes">
    <svg viewBox="0 0 220 150" aria-hidden="true">
      <path d="M12 140 C4 116 30 96 70 104 C110 92 150 106 186 96 C214 100 218 124 206 142 C140 136 80 148 12 140 Z" fill="#00f" stroke="#000" stroke-width="3"/>
      <path d="M50 58 L92 50 C100 62 120 62 128 48 L172 62 L186 88 L162 92 L160 112 C130 116 90 108 66 116 L64 92 L38 94 Z" fill="#0c0" stroke="#000" stroke-width="4"/>
      <path d="M130 30 C150 20 170 40 164 60 C160 70 146 66 148 56 C150 46 138 44 130 30 Z" fill="#f0f" stroke="#000" stroke-width="2"/>
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script src="script.js"></script>
</body>
</html>
