<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Put It In The Backpack</title>
<meta name="description" content="Click things. Put them in the backpack.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene">
  <header class="title">
    <h1>Put It In The Backpack</h1>
    <p>Click a thing. Put it in the backpack.</p>
  </header>

  <!-- The backpack. It never changes. That's the whole point. -->
  <div class="backpack" aria-hidden="true">
    <svg viewBox="0 0 300 370">
      <g stroke="var(--ink)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <!-- ground shadow -->
        <ellipse cx="150" cy="352" rx="118" ry="12" fill="var(--ink)" opacity=".13" stroke="none"/>
        <!-- carry loop -->
        <path d="M122 58 C120 16 180 16 178 58" fill="none" stroke-width="13"/>
        <path d="M122 58 C120 16 180 16 178 58" fill="none" stroke="var(--pack-dark)" stroke-width="4"/>
        <!-- shoulder straps peeking out the sides -->
        <path d="M58 118 C32 150 30 250 44 318 L64 314 C54 250 56 170 72 130 Z" fill="var(--pack-dark)"/>
        <path d="M242 118 C268 150 270 250 256 318 L236 314 C246 250 244 170 228 130 Z" fill="var(--pack-dark)"/>
        <!-- body -->
        <path d="M58 118 C56 66 98 48 150 48 C202 48 244 66 242 118 L248 306 C249 334 230 344 204 344 L96 344 C70 344 51 334 52 306 Z" fill="var(--pack)"/>
        <!-- shine -->
        <path d="M78 190 C76 160 78 140 84 124" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="7"/>
        <!-- flap -->
        <path d="M70 120 C68 82 104 64 150 64 C196 64 232 82 230 120 L232 158 C232 172 222 178 208 178 L92 178 C78 178 68 172 68 158 Z" fill="var(--pack-dark)"/>
        <path d="M84 122 C84 92 112 80 150 80 C188 80 216 92 216 122 L217 152 C217 160 212 163 204 163 L96 163 C88 163 83 160 83 152 Z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-dasharray="7 8"/>
        <!-- flap buckle strap -->
        <rect x="136" y="150" width="28" height="56" rx="6" fill="var(--ink)" stroke="none"/>
        <rect x="129" y="168" width="42" height="26" rx="6" fill="var(--brass)"/>
        <line x1="140" y1="181" x2="160" y2="181" stroke-width="5"/>
        <!-- front pocket -->
        <path d="M86 222 C86 210 94 206 106 206 L194 206 C206 206 214 210 214 222 L216 300 C216 316 206 322 192 322 L108 322 C94 322 84 316 84 300 Z" fill="var(--pocket)"/>
        <path d="M96 232 L204 232" fill="none" stroke-width="4" stroke-dasharray="3 6"/>
        <!-- zip pull -->
        <path d="M188 232 L194 256" fill="none" stroke-width="5"/>
        <rect x="186" y="252" width="16" height="22" rx="5" fill="var(--brass)" stroke-width="5" transform="rotate(-14 194 263)"/>
        <!-- star patch -->
        <circle cx="130" cy="276" r="24" fill="var(--paper)" stroke-width="5"/>
        <path d="M130 260 L135 271 L147 272 L138 280 L141 292 L130 285 L119 292 L122 280 L113 272 L125 271 Z" fill="var(--pack)" stroke-width="4"/>
      </g>
    </svg>
  </div>

  <button class="item ball" type="button" data-item aria-label="Basketball">
    <svg viewBox="0 0 130 135" aria-hidden="true">
      <g stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <ellipse cx="65" cy="124" rx="40" ry="7" fill="var(--ink)" opacity=".13" stroke="none"/>
        <circle cx="65" cy="62" r="54" fill="var(--ball)"/>
        <path d="M65 8 L65 116"/>
        <path d="M11 62 L119 62"/>
        <path d="M27 24 C50 44 50 80 27 100"/>
        <path d="M103 24 C80 44 80 80 103 100"/>
        <path d="M34 36 C40 26 50 20 60 18" stroke="#fff" stroke-opacity=".55" stroke-width="6"/>
      </g>
    </svg>
  </button>

  <button class="item shoes" type="button" data-item aria-label="A pair of shoes">
    <svg viewBox="0 0 210 140" aria-hidden="true">
      <defs>
        <g id="shoe" stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- upper -->
          <path d="M20 84 L22 44 C22 34 32 30 40 36 L62 52 C82 46 104 52 124 60 C150 64 168 72 170 86 Z" fill="var(--shoe)"/>
          <!-- toe cap -->
          <path d="M124 60 C150 64 168 72 170 86 L132 86 C128 76 126 68 124 60 Z" fill="var(--sole)"/>
          <!-- heel tab -->
          <path d="M22 50 L14 46 L14 70 L21 70" fill="var(--pack)"/>
          <!-- stripe -->
          <path d="M44 76 C62 62 84 60 104 70" fill="none" stroke="var(--sole)" stroke-width="7"/>
          <!-- laces -->
          <path d="M70 50 L78 62 M82 50 L90 63 M94 52 L101 65 M106 55 L112 67" fill="none" stroke-width="4.5"/>
          <!-- sole -->
          <path d="M14 84 L172 84 C176 96 168 104 152 104 L26 104 C16 104 11 96 14 84 Z" fill="var(--sole)"/>
          <path d="M18 96 L170 96" fill="none" stroke-width="3.5" stroke-dasharray="6 6"/>
        </g>
      </defs>
      <ellipse cx="104" cy="130" rx="88" ry="7" fill="var(--ink)" opacity=".13"/>
      <use href="#shoe" transform="translate(30 4) scale(0.94)"/>
      <use href="#shoe" transform="translate(4 22)"/>
    </svg>
  </button>

  <button class="item cup" type="button" data-item aria-label="A cup">
    <svg viewBox="0 0 140 150" aria-hidden="true">
      <g stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="66" cy="140" rx="46" ry="7" fill="var(--ink)" opacity=".13" stroke="none"/>
        <!-- steam -->
        <g class="steam" fill="none" stroke-opacity=".45" stroke-width="5">
          <path d="M52 34 C44 24 58 18 50 6"/>
          <path d="M74 34 C66 24 80 18 72 6"/>
        </g>
        <!-- handle -->
        <path d="M100 66 C130 62 130 108 98 106" fill="none" stroke-width="18"/>
        <path d="M100 66 C130 62 130 108 98 106" fill="none" stroke="var(--mug)" stroke-width="7"/>
        <!-- body -->
        <path d="M22 46 L110 46 L104 120 C103 128 97 132 88 132 L44 132 C35 132 29 128 28 120 Z" fill="var(--mug)"/>
        <!-- stripe -->
        <path d="M25 76 L107 76 L105 96 L27 96 Z" fill="var(--stripe)"/>
        <!-- rim -->
        <ellipse cx="66" cy="46" rx="44" ry="10" fill="var(--mug)"/>
        <ellipse cx="66" cy="47" rx="34" ry="5.5" fill="var(--coffee)" stroke-width="4"/>
        <path d="M38 60 L40 70" stroke="#fff" stroke-opacity=".8" stroke-width="6" fill="none"/>
      </g>
    </svg>
  </button>

  <button class="item clothes" type="button" id="clothes" aria-label="A pile of clothes">
    <svg viewBox="0 0 240 170" aria-hidden="true">
      <g stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="120" cy="158" rx="106" ry="8" fill="var(--ink)" opacity=".13" stroke="none"/>
        <!-- jeans, bottom of the pile, one leg flopped out -->
        <path d="M168 112 C196 112 220 126 232 142 C234 150 226 156 216 154 C204 142 186 136 166 134 Z" fill="var(--jeans)"/>
        <path d="M216 154 L228 138" fill="none" stroke-width="4"/>
        <path d="M22 150 C10 130 30 110 60 108 L170 104 C198 102 214 118 208 140 C206 150 196 154 176 154 L38 154 C30 154 25 153 22 150 Z" fill="var(--jeans)"/>
        <path d="M44 132 C90 126 140 126 190 132" fill="none" stroke-width="3.5" stroke-dasharray="5 6"/>
        <circle cx="62" cy="142" r="4" fill="var(--brass)" stroke-width="3"/>
        <!-- jumper, mostly buried, sleeve hanging out -->
        <path d="M60 116 C62 92 90 80 120 82 C150 80 178 92 180 116 Z" fill="var(--jumper)"/>
        <path d="M70 104 C54 108 40 118 30 134 C34 142 44 144 50 138 C56 128 66 120 78 116 Z" fill="var(--jumper)"/>
        <path d="M32 128 L46 142" fill="none" stroke-width="4"/>
        <!-- t-shirt, flung on top -->
        <g transform="rotate(-7 120 90)">
          <path d="M78 58 L100 50 C106 60 134 60 140 50 L162 58 L186 82 L168 96 L158 88 L158 120 C140 126 100 126 82 120 L82 88 L72 96 L54 82 Z" fill="var(--shirt)"/>
          <path d="M100 50 C106 66 134 66 140 50" fill="none" stroke-width="4.5"/>
          <path d="M96 100 C108 94 118 104 132 96" fill="none" stroke-width="4"/>
          <path d="M84 70 C86 78 84 84 82 88 M156 70 C154 78 156 84 158 88" fill="none" stroke-width="3.5" stroke-opacity=".6"/>
        </g>
        <!-- striped sock draped over the side -->
        <path d="M150 74 C162 70 178 74 186 88 L196 112 C200 122 194 130 184 130 C176 130 170 126 170 118 L166 96 C164 90 158 88 150 90 Z" fill="var(--sole)"/>
        <path d="M168 82 L158 92 M178 92 L166 100" fill="none" stroke="var(--pack)" stroke-width="7"/>
        <path d="M150 74 C162 70 178 74 186 88 L196 112 C200 122 194 130 184 130 C176 130 170 126 170 118 L166 96 C164 90 158 88 150 90 Z" fill="none"/>
        <path d="M150 74 C146 80 146 86 150 90" fill="none" stroke-width="4"/>
      </g>
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script src="script.js"></script>
</body>
</html>
